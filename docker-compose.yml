services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_agent_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_agent}
      POSTGRES_USER: ${POSTGRES_USER:-ai_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_agent_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai_agent_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  django:
    build: .
    container_name: ai_agent_django
    # NOTE: makemigrations on startup is for dev convenience.
    # In production: generate migrations in dev, commit them, run only `migrate`.
    command:
      - sh
      - -c
      - >
        python manage.py makemigrations --noinput &&
        python manage.py migrate --noinput &&
        gunicorn ai_agent.wsgi:application --bind 0.0.0.0:8000 --workers 3 --reload --access-logfile - --error-logfile -
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-secret-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,.ngrok-free.app,.ngrok.io,.ngrok.app}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      POSTGRES_DB: ${POSTGRES_DB:-ai_agent}
      POSTGRES_USER: ${POSTGRES_USER:-ai_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_agent_dev_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      WORKSPACE_ROOT: /workspaces
      REPOSITORY_ALLOWLIST: ${REPOSITORY_ALLOWLIST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
    volumes:
      - .:/app
      - workspaces:/workspaces
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    container_name: ai_agent_worker
    command: celery -A ai_agent worker -l info --concurrency=4
    healthcheck:
      disable: true
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-secret-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      POSTGRES_DB: ${POSTGRES_DB:-ai_agent}
      POSTGRES_USER: ${POSTGRES_USER:-ai_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_agent_dev_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      WORKSPACE_ROOT: /workspaces
      REPOSITORY_ALLOWLIST: ${REPOSITORY_ALLOWLIST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
    volumes:
      - .:/app
      - workspaces:/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  flower:
    image: mher/flower:2.0
    container_name: ai_agent_flower
    # No auth in dev — for production add an nginx reverse proxy with basic
    # auth in front, or set FLOWER_BASIC_AUTH=user:password (mher/flower env).
    environment:
      # Required by Flower 2.0+ for the JSON API to answer without auth.
      FLOWER_UNAUTHENTICATED_API: "true"
    command:
      - celery
      - --broker=redis://redis:6379/1
      - flower
      - --port=5555
      - --persistent=False
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---- Langfuse: per-agent trace tree (input/output, tokens, cost) ----
  # Self-hosted v2 — one app container plus its own Postgres (kept separate
  # from the Django DB so neither schema can collide with the other).
  langfuse_postgres:
    image: postgres:15-alpine
    container_name: ai_agent_langfuse_postgres
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_dev_password
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    container_name: ai_agent_langfuse
    depends_on:
      langfuse_postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse_dev_password@langfuse_postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      # NEXTAUTH_SECRET and SALT must be unique random strings in production.
      # Generate fresh ones with: openssl rand -base64 32
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-dev-only-nextauth-secret-replace-me}
      SALT: ${LANGFUSE_SALT:-dev-only-salt-replace-me}
      TELEMETRY_ENABLED: "false"
      # Allow signing up the first admin user via the web UI.
      AUTH_DISABLE_SIGNUP: "false"
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ---- ngrok: public HTTPS tunnel to the Django webhook endpoint ----
  # Opt-in only. Start with: docker compose --profile webhook up -d ngrok
  # Then open http://localhost:4040 to see the assigned public URL — paste
  # <url>/api/webhooks/jira (or /trello, /github) into the upstream system.
  # Free tier requires a personal authtoken from https://dashboard.ngrok.com.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ai_agent_ngrok
    profiles: ["webhook"]
    command:
      - http
      - django:8000
      - --log=stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"   # ngrok inspector — public URL shown here
    depends_on:
      - django
    restart: unless-stopped

volumes:
  postgres_data:
  workspaces:
  langfuse_postgres_data:
